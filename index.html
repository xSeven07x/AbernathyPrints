<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abernathy Prints - 3D Models</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #162238;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #d97706;
      --special: #22c55e;
      --fb-blue: #1877f2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding: 2rem 1rem; 
    }
    
    header { text-align: center; margin-bottom: 2rem; }
    .brand-logo { 
      max-width: 220px; 
      height: auto; 
      border-radius: 8px; 
      margin-bottom: 1rem; 
      display: inline-block;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }

    .promo-banner {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--special);
      color: #86efac;
      padding: 0.85rem;
      border-radius: 8px;
      max-width: 600px;
      margin: 0 auto 2.5rem auto;
      font-weight: 600;
      text-align: center;
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
      gap: 1.5rem; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    .card { 
      background: var(--card-bg); 
      border-radius: 8px; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      border: 1px solid #233554; 
    }
    .card img { 
      width: 100%; 
      height: 220px; 
      object-fit: cover; 
      background: #0f172a; 
      display: block;
    }
    .card-body { 
      padding: 1.25rem; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
    }
    .card-title { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .tags { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .tag { 
      font-size: 0.75rem; 
      background: #233554; 
      padding: 0.2rem 0.5rem; 
      border-radius: 4px; 
      color: #38bdf8; 
    }
    .card-desc { 
      font-size: 0.85rem; 
      color: var(--muted); 
      margin-bottom: 1rem; 
      flex: 1; 
    }
    .price-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: baseline; 
      margin-bottom: 1rem; 
    }
    .price { font-size: 1.25rem; font-weight: bold; color: var(--special); }
    .bundle-deal { font-size: 0.8rem; color: #fbbf24; }

    .btn-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .btn { 
      display: block; 
      text-align: center; 
      padding: 0.6rem; 
      border-radius: 6px; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 0.85rem; 
    }
    .btn-fb { background: var(--fb-blue); color: #ffffff; }
    .btn-alt { background: #233554; color: var(--text); }
  </style>
</head>
<body>

  <header>
    <img src="logo.jpg" alt="Abernathy Prints Logo" class="brand-logo">
    <h1>Abernathy Prints</h1>
    <p class="subtitle">Precision STL & 3MF Digital Files</p>
    <div class="promo-banner">
      House Special: $5 Each — Select 5 or more for $3 each!
    </div>
  </header>

  <main class="grid" id="catalog"></main>

    const catalog = document.getElementById("catalog");
    catalog.innerHTML = models.map(item => `

        <div class="card-body">
          <h2 class="card-title">${item.title}</h2>

            ${item.formats.map(fmt => `<span class="tag">${fmt}</span>`).join('')}
          </div>
          <p class="card-desc">${item.desc}</p>
          <div class="price-row">
            <span class="price">$5.00</span>
            <span class="bundle-deal">5+ for $3 ea</span>
          </div>
          <div class="btn-group">
            <a href="${item.fbLink}" target="_blank" class="btn btn-fb">Buy on Facebook</a>
            <a href="${item.directLink}" target="_blank" class="btn btn-alt">Direct Download</a>
          </div>
        </div>
      </article>
    `).join('');
  </script>
</body>
</html>
